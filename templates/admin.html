<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Panel de administración — Lumen" />
  <title>Admin — Lumen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
</head>
<body>

  <!-- ── SIDEBAR ─────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar__brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Lumen</span>
    </div>
    <nav class="sidebar__nav" aria-label="Navegación del panel">
      <a href="/" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Inicio
      </a>
      <a href="/admin" class="nav-item nav-item--active" aria-current="page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Usuarios
      </a>
    </nav>
    <div class="sidebar__footer">
      <span>v1.0.0</span>
    </div>
  </aside>

  <!-- ── MAIN ────────────────────────────────────────────── -->
  <main class="main">

    <!-- Header -->
    <header class="page-header">
      <div class="page-header__left">
        <h1 class="page-title">Usuarios registrados</h1>
        <p class="page-subtitle">Gestión y visualización de registros</p>
      </div>
      <div class="page-header__right">
        <button class="btn-export" id="btnExport" aria-label="Exportar datos a CSV">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exportar CSV
        </button>
      </div>
    </header>

    <!-- Stats bar -->
    <div class="stats-bar" id="statsBar" aria-live="polite">
      <div class="stat-card">
        <span class="stat-value" id="statTotal">—</span>
        <span class="stat-label">Total registros</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statFiltered">—</span>
        <span class="stat-label">Mostrando</span>
      </div>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <label for="searchInput" class="sr-only">Buscar usuario</label>
      <div class="search-bar__inner">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Buscar por nombre o correo…"
          aria-label="Buscar usuarios por nombre o correo"
          autocomplete="off"
        />
        <button class="search-clear" id="clearSearch" hidden aria-label="Limpiar búsqueda">✕</button>
      </div>
    </div>

    <!-- Table wrapper -->
    <div class="table-wrapper" role="region" aria-label="Tabla de usuarios" tabindex="0">
      <!-- Loading state -->
      <div class="table-loading" id="tableLoading" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p>Cargando usuarios…</p>
      </div>

      <!-- Error state -->
      <div class="table-error" id="tableError" hidden>
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <p id="tableErrorMsg">No se pudo cargar la información.</p>
        <button class="btn-retry" id="btnRetry">Reintentar</button>
      </div>

      <!-- Empty state -->
      <div class="table-empty" id="tableEmpty" hidden>
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        <p>No se encontraron usuarios.</p>
      </div>

      <!-- Table -->
      <table class="users-table" id="usersTable" hidden aria-label="Lista de usuarios registrados">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Nombre completo</th>
            <th scope="col">Correo electrónico</th>
            <th scope="col">Teléfono</th>
            <th scope="col">Fuente</th>
            <th scope="col">Fecha de registro</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <!-- Rows injected by JS -->
        </tbody>
      </table>
    </div>

  </main>

  <!-- ── TOAST CONTAINER ─────────────────────────────────── -->
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="false"></div>

  <script src="{{ url_for('static', filename='js/admin.js') }}" defer></script>
</body>
</html>
